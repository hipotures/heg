<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Structural Graph Lab</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
    h1 { margin-bottom: .25rem; }
    .muted { color: #aaa; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    .card { background: #1c1c1c; border: 1px solid #333; border-radius: 8px; padding: 1rem; }
    pre { white-space: pre-wrap; word-break: break-word; }
    button { margin-right: .5rem; padding: .5rem .75rem; }
  </style>
</head>
<body>
  <h1>Structural Graph Lab</h1>
  <p class="muted">Minimal live dashboard. Polling every two seconds.</p>
  <div class="grid">
    <section class="card"><h2>Status</h2><pre id="status">Loading…</pre></section>
    <section class="card">
      <h2>Controls</h2>
      <button data-action="START">Start</button>
      <button data-action="PAUSE">Pause</button>
      <button data-action="RESUME">Resume</button>
      <button data-action="STOP">Stop</button>
      <pre id="control"></pre>
    </section>
    <section class="card"><h2>Recent events</h2><pre id="logs">Loading…</pre></section>
  </div>
<script>
async function refresh() {
  const status = await fetch('/api/status', {cache: 'no-store'}).then(r => r.json());
  document.getElementById('status').textContent = JSON.stringify(status, null, 2);
  const logs = await fetch('/api/logs?limit=50', {cache: 'no-store'}).then(r => r.json());
  document.getElementById('logs').textContent = (logs.lines || []).join('\n');
}
for (const button of document.querySelectorAll('button[data-action]')) {
  button.addEventListener('click', async () => {
    const response = await fetch('/api/control', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: button.dataset.action})
    });
    document.getElementById('control').textContent = await response.text();
  });
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
