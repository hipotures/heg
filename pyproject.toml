[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-graph-lab"
version = "0.1.0"
description = "A compact research scaffold for structural graph conjecture search"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sat = ["python-sat"]
reference = ["networkx>=3.4"]
dev = []

[project.scripts]
sglab = "sglab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
