[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-graph-lab"
version = "0.2.0"
description = "A compact reproducible structural graph conjecture laboratory"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sat = ["python-sat"]
reference = ["networkx>=3.4"]
dev = []

[project.scripts]
sglab = "sglab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sglab.research" = ["assets/*.txt", "assets/*.json"]

[tool.setuptools.data-files]
"share/structural-graph-lab/web" = ["web/index.html"]
"share/structural-graph-lab/configs" = ["configs/default.toml"]
"share/structural-graph-lab/configs/targets" = ["configs/targets/erdos_gyarfas.toml"]
